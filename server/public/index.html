<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="YZ-Code 验证码查看器 · 实时查看 Android 端同步的短信验证码">
  <title>YZ-Code · 验证码查看器</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- ============ 登录 / 注册视图 ============ -->
  <main id="auth-view" class="view hidden">
    <section class="auth-card glass rise">
      <div class="brand">
        <img class="brand-logo" src="/icon.svg" alt="YZ-Code 标志" width="56" height="56">
        <h1 class="brand-name">YZ-Code</h1>
        <p class="brand-sub">验证码查看器 · 短信验证码实时同步</p>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true">登录</button>
        <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false">注册</button>
        <span class="tab-ink" aria-hidden="true"></span>
      </div>

      <form id="auth-form" novalidate>
        <label class="field">
          <span class="field-label">用户名</span>
          <input class="input" id="auth-username" type="text" autocomplete="username"
                 placeholder="2-32 个字符" maxlength="32" required>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input class="input" id="auth-password" type="password" autocomplete="current-password"
                 placeholder="至少 6 位" required>
        </label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">
          <span class="btn-text">登 录</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="auth-hint">登录状态长期有效，验证码数据按账号隔离</p>
    </section>
  </main>

  <!-- ============ 仪表盘视图 ============ -->
  <div id="dash-view" class="view hidden">
    <header class="topbar glass rise">
      <div class="topbar-brand">
        <img src="/icon.svg" alt="" width="30" height="30">
        <span class="topbar-name">YZ-Code</span>
      </div>
      <div class="topbar-right">
        <span class="user-chip" id="user-chip" title="当前登录用户"></span>
        <button type="button" class="btn btn-ghost" id="logout-btn">退出登录</button>
      </div>
    </header>

    <main class="dash-main">
      <!-- 最新验证码 -->
      <section class="latest-card glass rise" id="latest-card" style="--delay:.05s">
        <div class="latest-head">
          <span class="latest-title">最新验证码</span>
          <span class="live-badge"><span class="live-dot"></span>实时同步</span>
        </div>
        <button type="button" class="latest-code mono" id="latest-code" title="点击复制">------</button>
        <p class="latest-meta" id="latest-meta">等待第一条验证码…</p>
        <button type="button" class="btn btn-primary" id="copy-btn" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copy-btn-text">复制验证码</span>
        </button>
      </section>

      <!-- 历史记录 -->
      <section class="history-card glass rise" style="--delay:.15s">
        <div class="history-head">
          <h2 class="history-title">历史记录<span class="history-count" id="history-count"></span></h2>
          <div class="history-tools">
            <div class="search-box">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input class="input" id="filter-input" type="search" placeholder="搜索验证码 / 发送方 / 原文…" autocomplete="off">
            </div>
            <button type="button" class="btn btn-ghost-danger" id="clear-all-btn">清空全部</button>
          </div>
        </div>

        <ul class="history-list" id="history-list"></ul>

        <div class="empty-state hidden" id="empty-state">
          <svg viewBox="0 0 120 120" width="96" height="96" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="eg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <rect x="18" y="30" width="84" height="58" rx="12" stroke="url(#eg)" stroke-width="3" opacity=".8"/>
            <path d="M22 38l38 26 38-26" stroke="url(#eg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
            <circle cx="95" cy="25" r="10" stroke="url(#eg)" stroke-width="3" opacity=".5"/>
          </svg>
          <p class="empty-title" id="empty-title">暂无验证码</p>
          <p class="empty-sub" id="empty-sub">Android 端收到短信后会自动同步到这里</p>
        </div>
      </section>
    </main>
  </div>

  <footer class="page-footer">
    YZ-Code · 服务地址 <code class="mono">http://frp-act.com:17435</code>
  </footer>

  <!-- 确认对话框 -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal glass" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">确认清空全部历史？</h3>
      <p class="modal-desc">将删除当前账号下的所有验证码记录，此操作无法撤销。</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">取消</button>
        <button type="button" class="btn btn-danger" id="modal-confirm">确认清空</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
